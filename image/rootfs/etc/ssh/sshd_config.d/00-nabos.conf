# Standard authorized_keys, managed by the authenticated web administrator.
# Connect as nabos and use sudo for administration; direct root login is disabled.
AllowUsers nabos
PermitRootLogin no
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
UsePAM yes
AuthorizedKeysFile /data/nabos/ssh/authorized_keys
HostKey /data/system/ssh/etc/ssh/ssh_host_ed25519_key
HostKey /data/system/ssh/etc/ssh/ssh_host_rsa_key
HostKey /data/system/ssh/etc/ssh/ssh_host_ecdsa_key
