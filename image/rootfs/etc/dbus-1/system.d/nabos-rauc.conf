<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Root keeps full access (boot health); only device-core may install bundles
     and read the installer's properties. -->
<busconfig>
  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy user="root">
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>
  <policy user="device-core">
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="InstallBundle"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
