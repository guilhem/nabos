<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- D-Bus filters accounts. Hardware authenticates nabos.service via ProcessFD;
     the application authenticates the actual nab-hardware.service owner. -->
<busconfig>
  <policy context="default">
    <deny own="io.github.guilhem.NabHardware1"/>
    <deny send_destination="io.github.guilhem.NabHardware1"/>
  </policy>
  <policy user="nabos">
    <allow own="io.github.guilhem.NabHardware1"/>
    <allow send_destination="io.github.guilhem.NabHardware1"/>
  </policy>
  <policy user="root">
    <allow send_destination="io.github.guilhem.NabHardware1"/>
  </policy>
</busconfig>
