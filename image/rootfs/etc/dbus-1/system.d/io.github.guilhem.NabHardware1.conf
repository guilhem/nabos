<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Ownership and hardware calls are confined to dedicated service accounts. -->
<busconfig>
  <policy context="default">
    <deny own="io.github.guilhem.NabHardware1"/>
    <deny send_destination="io.github.guilhem.NabHardware1"/>
  </policy>
  <policy user="nab-hardware">
    <allow own="io.github.guilhem.NabHardware1"/>
  </policy>
  <policy user="nab-app">
    <allow send_destination="io.github.guilhem.NabHardware1"/>
  </policy>
  <policy user="root">
    <allow send_destination="io.github.guilhem.NabHardware1"/>
  </policy>
</busconfig>
