<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Bus policy admits the shared service account; device-core checks the
     sender's actual systemd unit for physical presence and maintenance agents. -->
<busconfig>
  <policy context="default">
    <deny own="io.github.guilhem.DeviceCore1"/>
    <deny send_destination="io.github.guilhem.DeviceCore1"/>
  </policy>
  <policy user="nabos">
    <allow own="io.github.guilhem.DeviceCore1"/>
    <allow send_destination="io.github.guilhem.DeviceCore1"/>
    <!-- Agents register a unique bus name, so callbacks cannot use the
         DeviceCore1 destination. Each agent authenticates the daemon owner. -->
    <allow send_type="method_call" send_interface="io.github.guilhem.DeviceCore1.Agent"
           send_path="/io/github/guilhem/DeviceCore1/Agent" send_member="Acquire"/>
    <allow send_type="method_call" send_interface="io.github.guilhem.DeviceCore1.Agent"
           send_path="/io/github/guilhem/DeviceCore1/Agent" send_member="Abort"/>
    <allow send_type="method_call" send_interface="io.github.guilhem.DeviceCore1.Agent"
           send_path="/io/github/guilhem/DeviceCore1/Agent" send_member="Release"/>
  </policy>
  <policy user="root">
    <allow send_destination="io.github.guilhem.DeviceCore1"/>
  </policy>
</busconfig>
