<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.nabaztag.Core"/>
    <deny send_destination="org.nabaztag.Core"/>
  </policy>
  <policy user="nabos">
    <allow own="org.nabaztag.Core"/>
    <allow send_destination="org.nabaztag.Core"/>
  </policy>
  <policy user="root">
    <allow send_destination="org.nabaztag.Core"/>
  </policy>
</busconfig>
