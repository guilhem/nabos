[system]
compatible=@COMPATIBLE@
bootloader=uboot
# Must match the attempts U-Boot restores in boot.cmd and uboot.env.
boot-attempts=3
boot-attempts-primary=3
# The root is read-only; slot status persists on /data.
mountprefix=/run/rauc
data-directory=/data/rauc
bundle-formats=-plain

[keyring]
path=/etc/rauc/ca.cert.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
