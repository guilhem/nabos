[Unit]
ConditionFileNotEmpty=/data/device-core/ssh/authorized_keys
ConditionPathExists=!/data/.volatile

[Service]
# Generate device keys on persistent storage before the vendor configuration check.
ExecStartPre=
ExecStartPre=/usr/bin/install -d -m 0700 /data/system/ssh/etc/ssh
ExecStartPre=/usr/bin/ssh-keygen -A -f /data/system/ssh
ExecStartPre=/usr/bin/sync -f /data/system/ssh/etc/ssh
ExecStartPre=/usr/sbin/sshd -t
