# Keep the user session private; device-core connects through its audio group.
module.protocol-native.args = {
  sockets = [
    { name = "pipewire-0" }
    { name = "pipewire-0-manager" }
    { name = "/run/nabos-audio/pipewire-0" group = "nab-audio" mode = "0660" }
  ]
}

module.access.args = {
  access.legacy = false
  access.socket = {
    pipewire-0 = "default"
    pipewire-0-manager = "unrestricted"
    "/run/nabos-audio/pipewire-0" = "unrestricted"
  }
}
