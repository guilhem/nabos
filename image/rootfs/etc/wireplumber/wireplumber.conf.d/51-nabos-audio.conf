# Only expose the Nabaztag card. Its hardware mixer belongs to
# tagtagtag-mixerd and the physical volume wheel; software gain stays separate.
wireplumber.profiles = {
  main = {
    monitor.bluez = disabled
  }
}

# The physical wheel is the reference at startup, with no saved attenuation.
wireplumber.settings = {
  device.restore-routes = false
  device.routes.default-sink-volume = 1.0
}

monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
  {
    matches = [ { api.alsa.card.name = "tagtagtag-sound" } ]
    actions = { update-props = {
      device.disabled = false
      api.alsa.soft-mixer = true
      api.alsa.disable-mixer-path = true
    } }
  }
]
