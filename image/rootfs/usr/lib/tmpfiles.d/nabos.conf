# Application data on the persistent partition (see docs/protocol-v1.md).
d /data/nabos 0750 nabos nabos -
d /data/nabos/media 0750 nabos nabos -
d /data/nabos/media/sounds 0750 nabos nabos -
d /data/nabos/media/choreographies 0750 nabos nabos -
d /data/device-core 0700 nabos nabos -
d /data/device-core/updates 0700 nabos nabos -
d /data/device-core/ssh 0700 nabos nabos -
# Root owns the directory: the daemon can flock the file but cannot replace it.
# No age, truncation or RuntimeDirectory cleanup: the inode survives restarts.
d /run/lock/device-core 0755 root root -
f /run/lock/device-core/network 0600 nabos nabos -
d /data/rauc 0700 root root -
# Prepared manual bundles are readable by nabos without exposing RAUC's private state.
d /data/nabos-rauc-manual 0750 root nabos -
# Remove previous-boot copies before device-core starts; runtime cleanup belongs to the actor.
r! /data/nabos-rauc-manual/input.raucb - - - -
r! /data/nabos-rauc-manual/bundle.raucb - - - -
d /var/lib/nabos/lva 0700 nabos nabos -
