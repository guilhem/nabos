# Application data on the persistent partition (see docs/protocol-v1.md).
d /data/nabos 0710 nab-app nab-media -
Z /data/nabos - nab-app - -
d /data/nabos/media 2750 nab-app nab-media -
d /data/nabos/media/sounds 2750 nab-app nab-media -
d /data/nabos/media/sounds/user 2750 nab-app nab-media -
d /data/nabos/media/choreographies 2750 nab-app nab-media -
Z /data/nabos/media - nab-app nab-media -
d /data/device-core 0700 device-core device-core -
Z /data/device-core - device-core device-core -
d /data/device-core/updates 0700 device-core device-core -
d /data/device-core/ssh 0700 device-core device-core -
# Root owns the directory: the daemon can flock the file but cannot replace it.
# No age, truncation or RuntimeDirectory cleanup: the inode survives restarts.
d /run/lock/device-core 0755 root root -
f /run/lock/device-core/network 0600 device-core device-core -
d /data/rauc 0700 root root -
# Prepared manual bundles are readable by device-core without exposing RAUC's private state.
d /data/nabos-rauc-manual 0750 root device-core -
# Remove previous-boot copies before device-core starts; runtime cleanup belongs to the actor.
r! /data/nabos-rauc-manual/input.raucb - - - -
r! /data/nabos-rauc-manual/bundle.raucb - - - -
# Independent homes require a root-owned parent for safe tmpfiles traversal.
d /var/lib/nabos 0711 root root -
d /var/lib/nabos/admin 0700 nabos nabos -
d /var/lib/nabos/lva 0700 nab-audio nab-audio -
Z /var/lib/nabos/lva - nab-audio nab-audio -
d /run/nabos-audio 0750 nab-audio nab-audio -
