# SD card layout (MBR, 16 GB card minimum). Inputs come from image/build.sh:
# boot.vfat (256 MiB), rootfs.ext4 (6 GiB, slot A), data.ext4 (1 GiB), uboot.env.
# Slot B has no image: it stays empty (never tried: BOOT_B_LEFT=0) until RAUC
# installs into it. /usr/lib/nabos/boot-init grows data to the end of the card.
image sdcard.img {
	hdimage {
	}

	# Redundant U-Boot environment, raw, before the first partition
	# (CONFIG_ENV_OFFSET/_REDUND, /etc/fw_env.config).
	partition uboot-env {
		in-partition-table = false
		offset = 1M
		image = "uboot.env"
	}

	partition uboot-env-redund {
		in-partition-table = false
		offset = 2M
		image = "uboot.env"
	}

	# p1 selects one of two FAT images; RAUC boot-mbr-switch writes the other
	# then switches this MBR entry. Neither copy is mounted at runtime.
	partition boot {
		partition-type = 0x0c
		bootable = true
		offset = 4M
		size = 256M
		image = "boot.vfat"
	}

	partition boot-redund {
		in-partition-table = false
		offset = 260M
		size = 256M
		image = "boot.vfat"
	}

	# p2: RAUC slot A (bootname A, root=/dev/mmcblk0p2)
	partition rootfs-a {
		partition-type = 0x83
		offset = 516M
		size = 6G
		image = "rootfs.ext4"
	}

	# p3: RAUC slot B (bootname B, root=/dev/mmcblk0p3)
	partition rootfs-b {
		partition-type = 0x83
		offset = 6660M
		size = 6G
	}

	# p4: persistent /data
	partition data {
		partition-type = 0x83
		offset = 12804M
		size = 1G
		image = "data.ext4"
	}
}
