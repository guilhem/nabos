name: Components
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.project }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        project: [go, rust, uboot]
        target: [zero-armv6, zero2-arm64]
        include:
          - target: zero-armv6
            rust-target: arm-unknown-linux-gnueabihf
            compiler: gcc-arm-linux-gnueabihf
          - target: zero2-arm64
            rust-target: aarch64-unknown-linux-gnu
            compiler: gcc-aarch64-linux-gnu
    runs-on: ${{ matrix.project == 'uboot' && matrix.target == 'zero2-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      PROJECT: ${{ matrix.project }}
      # Cache paths are part of setup-go's cache version, separating the targets.
      GOCACHE: ${{ github.workspace }}/build/cache/go/${{ matrix.target }}
      CCACHE_DIR: ${{ github.workspace }}/build/cache/uboot/${{ matrix.target }}
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.project == 'go'
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        if: matrix.project == 'rust'
        with:
          toolchain: '1.98.1'
          target: ${{ matrix.rust-target }}
          cache-workspaces: core
          cache-key: ${{ matrix.target }}-${{ hashFiles('image/rust-sysroots.lock.json', 'image/build-rust.sh') }}
          cache-directories: build/rust/${{ matrix.target }}/inputs/rust-sysroot
      - name: Rust linker
        if: matrix.project == 'rust'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
      - name: U-Boot dependencies
        if: matrix.project == 'uboot'
        id: toolchain
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$COMPILER" \
            build-essential bison flex bc libssl-dev device-tree-compiler \
            python3 python3-setuptools python3-pyelftools curl ca-certificates jq ccache
          echo "identity=$(dpkg-query -W | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: matrix.project == 'uboot'
        with:
          path: ${{ env.CCACHE_DIR }}
          key: uboot-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('image/build-uboot.sh', 'image/sources.lock.json', 'image/boot/uboot.config') }}
      - name: Compile Go service
        if: matrix.project == 'go'
        run: |
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; fi
          bash image/build-go.sh "$TARGET" "$version" "build/go/$TARGET"
      - name: Compile Rust core
        if: matrix.project == 'rust'
        run: bash image/build-rust.sh "$TARGET" "build/rust/$TARGET"
      - name: Compile U-Boot
        if: matrix.project == 'uboot'
        run: |
          bash image/build-uboot.sh "$TARGET" "build/uboot/$TARGET"
          ccache --show-stats
      - name: Archive component and replay inputs
        run: |
          mkdir -p build/components
          tar -C "build/$PROJECT/$TARGET" -cf "build/components/$PROJECT-$TARGET.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.project }}-${{ matrix.target }}
          path: build/components/${{ matrix.project }}-${{ matrix.target }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
