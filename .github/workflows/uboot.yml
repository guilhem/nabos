name: U-Boot
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero-armv6
            compiler: gcc-arm-linux-gnueabihf
            runner: ubuntu-24.04
          - target: zero2-arm64
            compiler: gcc-aarch64-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      CCACHE_DIR: ${{ github.workspace }}/build/cache/uboot/${{ matrix.target }}
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build dependencies
        id: toolchain
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "$COMPILER" \
            build-essential bison flex bc libssl-dev device-tree-compiler \
            python3 python3-setuptools python3-pyelftools curl ca-certificates jq ccache
          echo "identity=$(dpkg-query -W | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: uboot-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('Makefile', 'image/sources.lock.json', 'image/boot/uboot.config') }}
      - name: Cross-build and check U-Boot
        run: |
          make package-uboot TARGET="$TARGET"
          ccache --show-stats
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uboot-${{ matrix.target }}
          path: build/components/uboot-${{ matrix.target }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
