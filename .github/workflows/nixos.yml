name: NixOS prototype
on:
  push:
    branches: [main]
    paths: ['flake.nix', 'flake.lock', 'nix/**', 'image/**', 'services/**', 'core/**', 'assets/**', 'tools/**', 'LICENSE', 'NOTICE', '.github/workflows/nixos.yml']
  pull_request:
    paths: ['flake.nix', 'flake.lock', 'nix/**', 'image/**', 'services/**', 'core/**', 'assets/**', 'tools/**', 'LICENSE', 'NOTICE', '.github/workflows/nixos.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build SD images, or publish and benchmark cached closures on fresh runners'
        type: choice
        options: [build, benchmark]
        default: build
      version:
        description: 'Prototype version (benchmark version phase appends .next)'
        type: string
        default: dev-nixos
      nixpkgs_rev:
        description: 'Optional explicit 40-character Nixpkgs commit for the benchmark update phase'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: nixos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ github.workspace }}/build/nix-tmp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: mkdir -p "$TMPDIR"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nabos.cachix.org
            extra-trusted-public-keys = nabos.cachix.org-1:jLoce+DvPr6ejhFfvmEKXznQLVKxZ6zCP5N7dirR/JQ=
      - name: Parse, evaluate both configurations without builds, check metrics parser
        run: |
          python3 image/nix-cache-report.py --self-test
          bash -n image/nix-build.sh image/nix-test.sh image/nix-benchmark.sh
          while IFS= read -r file; do nix-instantiate --parse "$file" >/dev/null; done < <(find nix -name '*.nix' -print)
          nix-instantiate --parse flake.nix >/dev/null
          export NABOS_FLAKE="git+file://$PWD"
          for target in zero-armv6 zero2-arm64; do
            export NABOS_TARGET="$target"
            if [[ "$target" == zero-armv6 ]]; then
              export NABOS_BUILD_SYSTEM=x86_64-linux
            else
              export NABOS_BUILD_SYSTEM=aarch64-linux
            fi
            nix --extra-experimental-features 'nix-command flakes' eval --impure --raw \
              --option allow-import-from-derivation false --expr '
                let f = builtins.getFlake (builtins.getEnv "NABOS_FLAKE");
                    p = f.lib.mkPrototype {
                      buildSystem = builtins.getEnv "NABOS_BUILD_SYSTEM";
                      target = builtins.getEnv "NABOS_TARGET";
                      version = "dev-nixos";
                    };
                in p.payload.drvPath'
          done
  seed:
    # Only a manual run can build or publish; PR jobs never receive the token.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero-armv6
            runner: ubuntu-24.04
          - target: zero2-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
      TMPDIR: ${{ github.workspace }}/build/nix-tmp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate manual measurement inputs before building
        env:
          NIXPKGS_REV: ${{ inputs.nixpkgs_rev }}
        run: |
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,63}$ ]]
          if [[ "$MODE" == benchmark ]]; then
            test "${#VERSION}" -le 59 # Leave room for .next.
          fi
          if [[ -n "$NIXPKGS_REV" ]]; then
            [[ "$NIXPKGS_REV" =~ ^[0-9a-f]{40}$ ]]
            current=$(python3 -c 'import json; print(json.load(open("flake.lock"))["nodes"]["nixpkgs"]["locked"]["rev"])')
            test "$NIXPKGS_REV" != "$current"
          fi
      - run: mkdir -p "$TMPDIR"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nabos.cachix.org
            extra-trusted-public-keys = nabos.cachix.org-1:jLoce+DvPr6ejhFfvmEKXznQLVKxZ6zCP5N7dirR/JQ=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nabos
          skipPush: true
      - name: Build and validate prototype or measure cold runtime closures
        id: build
        run: |
          if [[ "$MODE" == benchmark ]]; then
            bash image/nix-benchmark.sh cold "$TARGET" "$VERSION"
            directory="dist/nixos/measurements/$TARGET/cold"
            roots="$directory/cache-roots.txt"
          else
            bash image/nix-build.sh "$TARGET" "$VERSION" --development
            directory="dist/nixos/$TARGET"
            roots="$directory/cache-roots"
          fi
          printf 'directory=%s\nroots=%s\n' "$directory" "$roots" >> "$GITHUB_OUTPUT"
          python3 image/nix-cache-report.py "$roots" --output "$directory/cache-before-push.json"
      - name: Publish only system and U-Boot runtime closures
        if: github.ref == 'refs/heads/main' || inputs.mode == 'benchmark'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHE: ${{ vars.CACHIX_CACHE }}
          ROOTS: ${{ steps.build.outputs.roots }}
          DIRECTORY: ${{ steps.build.outputs.directory }}
        run: |
          test "$CACHE" = nabos
          test -n "$CACHIX_AUTH_TOKEN"
          # Explicit roots exclude the payload, SD images, bundles and dev shell.
          cachix push "$CACHE" < "$ROOTS"
          python3 image/nix-cache-report.py "$ROOTS" --require-published \
            --output "$DIRECTORY/cache-after-push.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nixos-${{ inputs.mode }}-${{ matrix.target }}
          path: dist/nixos/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
  warm:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'benchmark'
    needs: seed
    strategy:
      fail-fast: false
      matrix:
        target: [zero-armv6, zero2-arm64]
        phase: ${{ fromJSON(inputs.nixpkgs_rev != '' && '["warm","version","nixpkgs"]' || '["warm","version"]') }}
        include:
          - target: zero-armv6
            runner: ubuntu-24.04
          - target: zero2-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      TARGET: ${{ matrix.target }}
      PHASE: ${{ matrix.phase }}
      VERSION: ${{ inputs.version }}
      NIXPKGS_REV: ${{ inputs.nixpkgs_rev }}
      TMPDIR: ${{ github.workspace }}/build/nix-tmp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: mkdir -p "$TMPDIR"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nabos.cachix.org
            extra-trusted-public-keys = nabos.cachix.org-1:jLoce+DvPr6ejhFfvmEKXznQLVKxZ6zCP5N7dirR/JQ=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nabos
          skipPush: true
      - name: Measure on a fresh runner with no restored Nix store
        run: |
          if [[ "$PHASE" == version ]]; then VERSION="$VERSION.next"; fi
          if [[ "$PHASE" == nixpkgs ]]; then
            [[ "$NIXPKGS_REV" =~ ^[0-9a-f]{40}$ ]]
            nix --extra-experimental-features 'nix-command flakes' flake lock \
              --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV"
          fi
          bash image/nix-benchmark.sh "$PHASE" "$TARGET" "$VERSION"
          directory="dist/nixos/measurements/$TARGET/$PHASE"
          python3 image/nix-cache-report.py "$directory/cache-roots.txt" \
            --output "$directory/cache-before-push.json"
          cp flake.lock "$directory/flake.lock"
      - name: Publish only measured runtime closures and read actual compressed sizes
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHE: ${{ vars.CACHIX_CACHE }}
        run: |
          test "$CACHE" = nabos
          test -n "$CACHIX_AUTH_TOKEN"
          directory="dist/nixos/measurements/$TARGET/$PHASE"
          cachix push "$CACHE" < "$directory/cache-roots.txt"
          python3 image/nix-cache-report.py "$directory/cache-roots.txt" --require-published \
            --output "$directory/cache-after-push.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nixos-benchmark-${{ matrix.target }}-${{ matrix.phase }}
          path: dist/nixos/measurements/
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7
  report:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'benchmark'
    needs: [seed, warm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: nixos-benchmark-*
          path: measurements
      - name: Recheck the union after all pushes to detect missing or evicted paths
        run: |
          mapfile -t reports < <(find measurements -name cache-after-push.json -print)
          test "${#reports[@]}" -gt 0
          python3 image/nix-cache-report.py --merge "${reports[@]}" \
            --require-published --output dist/nixos/cache-union.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nixos-cache-union
          path: dist/nixos/cache-union.json
          if-no-files-found: warn
