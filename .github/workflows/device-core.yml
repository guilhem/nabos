name: Device core
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero-armv6
            rust-target: arm-unknown-linux-gnueabihf
          - target: zero2-arm64
            rust-target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.sum
      - name: Fetch pinned source
        id: source
        env:
          TARGET: ${{ matrix.target }}
        run: |
          make device-core-source OUT="$PWD/build/device-core-build/$TARGET"
          printf 'path=%s\n' "$(cat "build/device-core-build/$TARGET/source-path")" >> "$GITHUB_OUTPUT"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: '1.98.1'
          target: ${{ matrix.rust-target }}
          cache-workspaces: ${{ steps.source.outputs.path }}
          cache-key: ${{ matrix.target }}-${{ hashFiles('image/sources.lock.json', 'image/rust-sysroots.lock.json', 'Makefile') }}
          cache-directories: |
            build/cargo/device-core
            build/device-core-build/${{ matrix.target }}/inputs/rust-sysroot
      - name: Install linker
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld llvm
      - name: Cross-compile pinned device-core and archive inputs
        env:
          TARGET: ${{ matrix.target }}
        run: make package-device-core TARGET="$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: device-core-${{ matrix.target }}
          path: build/components/device-core-${{ matrix.target }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
