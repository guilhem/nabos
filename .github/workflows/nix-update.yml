name: Monthly Nix inputs
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: nix-inputs-update
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'guilhem/nabos'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: allow-import-from-derivation = false
      - name: Update only Nixpkgs and nixos-hardware
        run: nix --extra-experimental-features 'nix-command flakes' flake update nixpkgs nixos-hardware
      - name: Open a draft and dispatch both development image builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- flake.lock; then exit 0; fi
          branch=codex/nix-inputs-update
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.lock
          git commit -m 'chore: update the NixOS platform inputs'
          gh auth setup-git
          git fetch origin "$branch" || true
          git push --force-with-lease origin "HEAD:$branch"
          printf '%s\n' \
            'Updates Nixpkgs and nixos-hardware together; application sources and image formats stay pinned.' \
            '' \
            'Images is dispatched on this branch to build and test both targets and measure their selected Cachix closure. Approve any ordinary pull-request workflow waiting for approval, then require all PR checks before review or merge. Compare the cache reports with the currently published closure before accepting the update.' \
            > "$RUNNER_TEMP/nix-update-body.md"
          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            gh pr create --base main --head "$branch" --draft \
              --title 'chore: update the NixOS platform inputs' --body-file "$RUNNER_TEMP/nix-update-body.md"
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/nix-update-body.md"
          fi
          # Explicit dispatch runs even when GITHUB_TOKEN-created events wait for approval.
          gh workflow run images.yml --ref "$branch" -f mode=build
