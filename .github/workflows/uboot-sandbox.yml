name: U-Boot sandbox
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero-armv6
            runner: ubuntu-24.04
          - target: zero2-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      OUT: ${{ github.workspace }}/build/uboot-sandbox/${{ matrix.target }}
      GOCACHE: ${{ github.workspace }}/build/cache/uboot-sandbox-go
      TMPDIR: ${{ github.workspace }}/build/cache-check-tmp
      LC_ALL: C
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native build dependencies
        id: toolchain
        run: |
          mkdir -p "$TMPDIR"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential binutils bison flex bc libssl-dev \
            python3 python3-setuptools python3-pyelftools
          echo "identity=$(dpkg-query -W | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: sandbox
        with:
          path: |
            ${{ env.OUT }}/u-boot
            ${{ env.OUT }}/scripts/dtc/dtc
            ${{ env.OUT }}/tools/mkimage
            ${{ env.OUT }}/tools/mkenvimage
            ${{ env.OUT }}/SHA256SUMS
          key: uboot-sandbox-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.identity }}-${{ hashFiles('image/uboot-sandbox.sh', 'image/sources.lock.json', '.github/workflows/uboot-sandbox.yml', 'services/go.mod', 'services/cmd/nab-image/*.go') }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.sandbox.outputs.cache-hit != 'true'
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build locked native sandbox
        if: steps.sandbox.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/iot
          (cd services && GOTOOLCHAIN=local CGO_ENABLED=0 go build -o ../build/iot/nab-image ./cmd/nab-image)
          source=$(build/iot/nab-image source image/sources.lock.json uboot build/iot/inputs build/iot/uboot-src)
          bash image/uboot-sandbox.sh "$source" "$OUT"
      - name: Verify ready sandbox and archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd "$OUT"
          sha256sum --check --strict SHA256SUMS
          case $(uname -m) in
            x86_64) expected='Advanced Micro Devices X86-64' ;;
            aarch64) expected=AArch64 ;;
            *) echo 'Unsupported native sandbox architecture' >&2; exit 1 ;;
          esac
          for binary in u-boot scripts/dtc/dtc tools/mkimage tools/mkenvimage; do
            test -x "$binary"
            machine=$(readelf -h "$binary" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')
            test "$machine" = "$expected"
          done
          ./u-boot -h > /dev/null
          ./scripts/dtc/dtc -v
          ./tools/mkimage -V
          ./tools/mkenvimage -V
          mkdir -p "$GITHUB_WORKSPACE/build/components"
          tar -cf "$GITHUB_WORKSPACE/build/components/uboot-sandbox-$TARGET.tar" \
            u-boot scripts/dtc/dtc tools/mkimage tools/mkenvimage SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: uboot-sandbox-${{ matrix.target }}
          path: build/components/uboot-sandbox-${{ matrix.target }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
