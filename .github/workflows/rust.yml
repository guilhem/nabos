name: Rust core
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero-armv6
            rust-target: arm-unknown-linux-gnueabihf
          - target: zero2-arm64
            rust-target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld
          rustup toolchain install 1.98.1 --profile minimal --target '${{ matrix.rust-target }}'
          rustup default 1.98.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
            build/rust/${{ matrix.target }}/inputs/rust-sysroot
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('image/sources.lock.json', 'image/rust-sysroots.lock.json', 'image/build-rust.sh', 'core/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('image/sources.lock.json', 'image/rust-sysroots.lock.json', 'image/build-rust.sh', 'core/Cargo.lock') }}-
      - name: Cross-compile core and archive inputs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bash image/build-rust.sh "$TARGET" "build/rust/$TARGET"
          mkdir -p build/components
          tar -C "build/rust/$TARGET" -cf "build/components/rust-$TARGET.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-${{ matrix.target }}
          path: build/components/rust-${{ matrix.target }}.tar
          if-no-files-found: error
          retention-days: 1
