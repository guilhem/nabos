name: Go application
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [zero-armv6, zero2-arm64]
    env:
      # Cache paths separate the platforms in setup-go's built-in cache.
      GOCACHE: ${{ github.workspace }}/build/cache/go/${{ matrix.target }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.sum
      - name: Cross-compile application and archive inputs
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version=$GITHUB_REF_NAME; fi
          make package-go TARGET="$TARGET" VERSION="$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-${{ matrix.target }}
          path: build/components/go-${{ matrix.target }}.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
