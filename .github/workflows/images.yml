name: Images
on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'services/**'
      - 'image/**'
      - 'tools/**'
      - 'assets/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'Makefile'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'core/**'
      - 'services/**'
      - 'image/**'
      - 'tools/**'
      - 'assets/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'Makefile'
      - '.github/workflows/**'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    uses: ./.github/workflows/tests.yml
  go:
    uses: ./.github/workflows/go.yml
  rust:
    uses: ./.github/workflows/rust.yml
  device-core:
    uses: ./.github/workflows/device-core.yml
  uboot:
    uses: ./.github/workflows/uboot.yml
  uboot-sandbox:
    uses: ./.github/workflows/uboot-sandbox.yml
  build:
    needs: [test, go, rust, device-core, uboot]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero-armv6
            runner: ubuntu-24.04
          - target: zero2-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.sum
      - name: Build dependencies
        run: bash image/host-deps.sh
      - name: Prepared base identity
        id: base-cache
        env:
          TARGET: ${{ matrix.target }}
        run: |
          NABOS_BASE_CACHE_EPOCH=$(date -u +%F)
          export NABOS_BASE_CACHE_EPOCH
          key=$(bash image/base-cache.sh key "$TARGET")
          printf 'NABOS_BASE_CACHE_EPOCH=%s\n' "$NABOS_BASE_CACHE_EPOCH" >> "$GITHUB_ENV"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/cache/base/${{ matrix.target }}
          key: prepared-base-${{ runner.os }}-${{ runner.arch }}-${{ steps.base-cache.outputs.key }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: '*-${{ matrix.target }}'
          path: build/components
          merge-multiple: true
      - name: Prepare signing material
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.RAUC_SIGNING_KEY }}
          SIGNING_CERT: ${{ secrets.RAUC_SIGNING_CERT }}
        run: |
          umask 077
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_CERT"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/rauc-key.pem"
          printf '%s\n' "$SIGNING_CERT" > "$RUNNER_TEMP/rauc-cert.pem"
      - name: Assemble, sign and compress image
        env:
          TARGET: ${{ matrix.target }}
          RAUC_KEY: ${{ runner.temp }}/rauc-key.pem
          RAUC_CERT: ${{ runner.temp }}/rauc-cert.pem
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bash image/build.sh "$TARGET" "$GITHUB_REF_NAME" --components build/components --defer-tests
          else
            bash image/build.sh "$TARGET" "dev-${GITHUB_SHA:0:12}" --development --components build/components --defer-tests
          fi
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/rauc-key.pem" "$RUNNER_TEMP/rauc-cert.pem"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nabos-${{ matrix.target }}
          path: dist/${{ matrix.target }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: diagnostics-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*.txt
          retention-days: 7
  image-test:
    needs: [build, uboot-sandbox]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: zero-armv6
            runner: ubuntu-24.04
          - target: zero2-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GOCACHE: ${{ github.workspace }}/build/cache/image-tests/${{ matrix.target }}/go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.GOCACHE }}
          key: image-tests-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.27.1-${{ hashFiles('services/go.sum') }}-${{ github.sha }}
          restore-keys: |
            image-tests-go-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.27.1-${{ hashFiles('services/go.sum') }}-
      - name: Test dependencies
        run: bash image/host-deps.sh
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nabos-${{ matrix.target }}
          path: dist/${{ matrix.target }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: uboot-${{ matrix.target }}
          path: build/components
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: uboot-sandbox-${{ matrix.target }}
          path: build/components
      - name: Verify the built image with the prebuilt sandbox
        env:
          TARGET: ${{ matrix.target }}
        run: bash image/test-artifact.sh "$TARGET" "dist/$TARGET" build/components
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, image-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: nabos-*
          path: dist
          merge-multiple: true
      - name: Verify artifacts and upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS-zero-armv6 SHA256SUMS-zero2-arm64
          manifest=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name == "SHA256SUMS") | .name')
          if [[ -n $manifest ]]; then
            gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*
          cat SHA256SUMS-zero-armv6 SHA256SUMS-zero2-arm64 > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber SHA256SUMS
