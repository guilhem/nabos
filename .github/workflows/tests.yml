name: Tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.sum
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients shellcheck device-tree-compiler
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
          cache-workspaces: core
      - name: Rust
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path core/Cargo.toml
      - name: Go
        working-directory: services
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - name: Shell and protocol checks
        working-directory: services
        run: |
          for script in ../image/*.sh; do bash -n "$script"; done
          shellcheck -x ../image/*.sh
          for component in go rust uboot; do
            { printf 'set -euo pipefail\n'; make -C .. --no-print-directory -n "$component"; } | shellcheck -s bash -
          done
          NABOS_INTEGRATION=1 go test -race -count=1 -v ./tests/integration ./cmd/nab-service
