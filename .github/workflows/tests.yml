name: Tests
on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
  workflow_dispatch:
permissions:
  contents: read
env:
  TMPDIR: ${{ github.workspace }}/build/nix-tmp
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.sum
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mosquitto mosquitto-clients shellcheck device-tree-compiler \
            genimage=17-2 rauc=1.11.3-2 dosfstools mtools u-boot-tools libubootenv-tool \
            squashfs-tools openssl jq dbus fdisk
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
          cache-workspaces: core
      - name: Rust
        run: |
          cargo fmt --manifest-path core/Cargo.toml --check
          cargo clippy --locked --manifest-path core/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path core/Cargo.toml
      - name: Go
        working-directory: services
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: LED recovery with missing sysfs attributes
        run: |
          paths=$(nix --extra-experimental-features 'nix-command flakes' eval --impure --json --expr '
            ((builtins.getFlake ("git+file://" + toString ./.)).lib.mkImage {
              buildSystem = "x86_64-linux"; target = "zero-armv6";
            }).system.config.systemd.services.nab-hardware.serviceConfig.ReadWritePaths
          ' | jq -er 'select(length > 0) | join(" ")')
          recovered=$(sudo systemd-run --wait --pipe --collect \
            -p ProtectSystem=strict -p CapabilityBoundingSet= -p "ReadWritePaths=$paths" \
            -p 'ExecStopPost=/usr/bin/printf led-cleanup-ran' /bin/true)
          [[ $recovered == *led-cleanup-ran* ]]
          if blocked=$(sudo systemd-run --wait --pipe --collect \
            -p ProtectSystem=strict \
            -p ReadWritePaths=/sys/class/leds/nabos-test-unavailable/brightness \
            -p 'ExecStopPost=/usr/bin/printf led-cleanup-ran' /bin/true 2>&1); then
            echo 'Mandatory missing path unexpectedly allowed namespace setup' >&2
            exit 1
          fi
          [[ $blocked != *led-cleanup-ran* ]]
      - name: RAUC on a disposable loop device
        working-directory: services/tests/image
        run: |
          go test -race -c -o "$RUNNER_TEMP/nabos-image-tests" .
          sudo env NABOS_RAUC_INTEGRATION=1 unshare --mount --propagation private \
            "$RUNNER_TEMP/nabos-image-tests" -test.run '^TestRaucBootMBRIntegration$' -test.v -test.timeout 10m
      - name: Shell and runtime fixture checks
        run: |
          for script in image/*.sh nix/runtime/*.sh; do bash -n "$script"; done
          shellcheck -x image/*.sh nix/runtime/*.sh
          python3 image/test-service-accounts.py --self-test
  device-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: mkdir -p "$TMPDIR"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: services/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        with:
          toolchain: '1.98.1'
          components: rustfmt,clippy
          cache-workspaces: core
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libglib2.0-bin openssh-client mosquitto mosquitto-clients iproute2 \
            rauc squashfs-tools openssl
          # The distro service profile only permits its system configuration paths.
          # Test brokers use private generated configurations and an isolated executable.
          cp /usr/sbin/mosquitto "$RUNNER_TEMP/nabos-test-mosquitto"
          printf 'MOSQUITTO=%s/nabos-test-mosquitto\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://nabos.cachix.org
            extra-trusted-public-keys = nabos.cachix.org-1:jLoce+DvPr6ejhFfvmEKXznQLVKxZ6zCP5N7dirR/JQ=
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: github.repository == 'guilhem/nabos' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        with:
          name: nabos
          skipPush: true
      - name: Build and test pinned native Nix packages
        run: |
          : > build/native-test-cache-roots
          for package in device-core nab-hardware nabos; do
            nix --extra-experimental-features 'nix-command flakes' build \
              --no-update-lock-file ".#$package-native" --out-link "build/$package-native" \
              --print-out-paths >> build/native-test-cache-roots
          done
          nix --extra-experimental-features 'nix-command flakes' build \
            --no-update-lock-file .#checks.x86_64-linux.audio-boot \
            --out-link build/audio-boot-test --print-out-paths >> build/native-test-cache-roots
          {
            printf 'DEVICE_CORE_BIN=%s/build/device-core-native/bin/device-core\n' "$PWD"
            printf 'NABOS_HARDWARE_BIN=%s/build/nab-hardware-native/bin/nab-hardware\n' "$PWD"
            printf 'NABOS_BIN=%s/build/nabos-native/bin/nabos\n' "$PWD"
          } >> "$GITHUB_ENV"
      - name: Native D-Bus clients and Home Assistant MQTT fixtures
        run: |
          cargo test --locked --manifest-path core/Cargo.toml -- --ignored
          NABOS_INTEGRATION=1 go -C services test -race -count=1 -v ./cmd/nabos ./internal/rabbit ./internal/devicetest
          NABOS_INTEGRATION=1 go -C services test -race -count=1 -v ./tests/integration -run '^TestDeviceCore$'
          mkdir -p build/tests
          go -C services test -race -c -o "$PWD/build/tests/integration.test" ./tests/integration
          cd services
          sudo env "PATH=$PATH" "TMPDIR=/tmp" \
            "NABOS_HARDWARE_BIN=$NABOS_HARDWARE_BIN" "NABOS_BIN=$NABOS_BIN" \
            "DEVICE_CORE_BIN=$DEVICE_CORE_BIN" "NABOS_TEST_ASSETS=$GITHUB_WORKSPACE/assets" "MOSQUITTO=$MOSQUITTO" \
            unshare --mount --net --fork --kill-child --propagation private \
            bash -s -- "$GITHUB_WORKSPACE/build/tests/integration.test" <<'NAMESPACE'
          set -euo pipefail
          ip link set lo up
          identity=$(mktemp -d)
          trap 'umount /etc/group /etc/passwd 2>/dev/null || true; rm -rf -- "$identity"' EXIT
          # Only this namespace sees the product accounts; host accounts stay intact.
          awk -F: '$1 != "nab-app" && $1 != "nab-hardware" && $1 != "device-core" && ($3 < 1001 || $3 > 1003)' /etc/passwd > "$identity/passwd"
          awk -F: '$1 != "nab-app" && $1 != "nab-hardware" && $1 != "device-core" && ($3 < 1001 || $3 > 1003)' /etc/group > "$identity/group"
          printf '%s\n' 'nab-app:x:1001:1001::/nonexistent:/usr/sbin/nologin' 'nab-hardware:x:1002:1002::/nonexistent:/usr/sbin/nologin' 'device-core:x:1003:1003::/nonexistent:/usr/sbin/nologin' >> "$identity/passwd"
          printf '%s\n' 'nab-app:x:1001:' 'nab-hardware:x:1002:' 'device-core:x:1003:' >> "$identity/group"
          chmod 0644 "$identity/passwd" "$identity/group"
          mount --bind "$identity/passwd" /etc/passwd
          mount --bind "$identity/group" /etc/group
          # Dedicated users cannot traverse the runner's private build tree.
          runtime=$(mktemp -d)
          trap 'umount /etc/group /etc/passwd 2>/dev/null || true; rm -rf -- "$identity" "$runtime"' EXIT
          chmod 0755 "$runtime"
          install -m 0755 "$NABOS_BIN" "$runtime/nabos"
          install -m 0755 "$NABOS_HARDWARE_BIN" "$runtime/nab-hardware"
          install -m 0755 "$DEVICE_CORE_BIN" "$runtime/device-core"
          cp -a "$NABOS_TEST_ASSETS" "$runtime/assets"
          export NABOS_BIN="$runtime/nabos" NABOS_HARDWARE_BIN="$runtime/nab-hardware"
          export DEVICE_CORE_BIN="$runtime/device-core" NABOS_TEST_ASSETS="$runtime/assets"
          export NABOS_INTEGRATION=1 NABOS_APP_USER=nab-app NABOS_HARDWARE_USER=nab-hardware NABOS_DEVICE_USER=device-core
          "$1" -test.run '^TestEndToEnd$' -test.count=1 -test.v -test.timeout=10m
          NAMESPACE
      - name: Publish tested native package roots
        continue-on-error: true
        if: github.repository == 'guilhem/nabos' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          cachix push nabos < build/native-test-cache-roots
          unset CACHIX_AUTH_TOKEN
          python3 image/cache-report.py build/native-test-cache-roots --require-published \
            --output build/native-test-cache-report.json
