[package]
name = "nab-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "NabOS hardware core: ears, LEDs, button, RFID/NFC, audio and choreographies driven over MQTT 5"

[[bin]]
name = "nab-core"
path = "src/main.rs"

[dependencies]
rumqttc = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync", "signal", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpiocdev = "0.7"
libc = "0.2"
fastrand = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
