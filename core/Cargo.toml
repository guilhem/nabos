[package]
name = "nab-hardware"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "NabOS physical hardware service over typed local D-Bus"

[[bin]]
name = "nab-hardware"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal"] }
gpiocdev = "0.7"
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
